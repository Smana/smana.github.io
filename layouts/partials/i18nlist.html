{{ with .Translations }}
<div class="post_i18n">
  <h2 class="post_i18n_label mb-0">{{ T "translations" }}:</h2>
  <nav class="tags_nav" aria-label="{{ T "translations" }}">
    {{ range . }}
      <a href="{{ .Permalink }}" class="post_tag button button_translucent">{{ .Language.Params.label }}</a>
    {{ end }}
  </nav>
</div>
{{ end }}
