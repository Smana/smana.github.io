{{- $t := site.Title -}}
{{- $dark := absURL "logos/logo-dark.webp" -}}
<div class="nav_brand_wrap{{ with .class }} {{ . }}{{ end }}">
  <a href='{{ absLangURL "" }}' class="nav_brand nav_item" title="{{ $t }}">
    <img src="{{ $dark }}" class="logo" alt="{{ $t }}" width="240" height="60">
  </a>
  {{- if ne (strings.HasSuffix .class "center") true }}
  <button type="button" class="nav_close" aria-label="Toggle menu">
    <span>
      {{- partialCached "sprite" (dict "icon" "open-menu") -}}
      {{- partialCached "sprite" (dict "icon" "closeme") -}}
    </span>
  </button>
  {{- end }}
</div>
